# Single-host deployment: PostgreSQL + app. Put a TLS-terminating reverse proxy
# (Caddy, nginx, a cloud load balancer) in front of port 5173 — see docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bayleaf
      POSTGRES_USER: bayleaf
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayleaf"]
      interval: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bayleaf:${DB_PASSWORD}@db:5432/bayleaf
      DATABASE_SSL: "false"   # private Docker network on the same host
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  pgdata:
