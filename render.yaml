services:
  # The Web Application (API + Frontend)
  - type: web
    name: bayleaf-loyalty
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_SSL
        value: false
      - key: OTP_PROVIDER
        value: console
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bayleaf-db
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: APP_HASH_KEY
        generateValue: true

# The Managed PostgreSQL Database
databases:
  - name: bayleaf-db
    plan: free
    databaseName: bayleaf
    user: bayleaf
